{% extends "manage/base_manage.html" %}
{% block content %}<h1>Customers</h1>
<form class="bar"><input name="q" value="{{ q }}" placeholder="Search name or phone"><button class="btn">Search</button> <a class="btn gold" href="{% url 'customer_new' %}">+ New</a></form>
<div class="card scroll"><table><tr><th>Name</th><th>Phone</th><th>Loans</th><th>Balance</th></tr>
{% for c in customers %}<tr><td><a href="{% url 'customer_detail' c.id %}">{{ c.name }}</a></td><td>{{ c.phone }}</td><td>{{ c.loans.all|length }}</td><td>₹{{ c.balance }}</td></tr>{% empty %}<tr><td colspan="4" class="empty">No customers yet.</td></tr>{% endfor %}</table></div>{% endblock %}
